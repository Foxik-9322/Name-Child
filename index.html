<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Выбор Имени для Мальчика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* БАЗОВАЯ (СВЕТЛАЯ) ТЕМА */
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(148, 163, 184, 0.2);
            --accent-primary: #475569; 
            --accent-hover: #334155;
            --accent-success: #10b981;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --glass-blur: blur(20px);
            --shadow-color: rgba(0, 0, 0, 0.05);
            --input-bg: rgba(255, 255, 255, 0.5);
            --tab-bg: rgba(226, 232, 240, 0.5);
        }

        /* ТЕМНАЯ ТЕМА */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
                --card-bg: rgba(30, 41, 59, 0.7);
                --card-border: rgba(255, 255, 255, 0.08);
                --accent-primary: #64748b;
                --accent-hover: #94a3b8;
                --accent-success: #10b981;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --shadow-color: rgba(0, 0, 0, 0.3);
                --input-bg: rgba(15, 23, 42, 0.6);
                --tab-bg: rgba(15, 23, 42, 0.6);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)) 20px;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-grow: 1;
        }

        /* Заголовок */
        header {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ЕДИНЫЙ ЛИПКИЙ БЛОК УПРАВЛЕНИЯ И ВКЛАДОК */
        .control-panel {
            position: sticky;
            top: 20px;
            z-index: 40;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 35px var(--shadow-color);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 500;
        }

        .stats span {
            color: var(--text-main);
            font-weight: 700;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button, .btn-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .btn-save {
            background: var(--accent-primary);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .btn-save:hover, .btn-save:active {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-restore {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
        }

        .btn-restore:hover, .btn-restore:active {
            background: var(--card-border);
            transform: translateY(-2px);
        }

        /* Поиск */
        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(71, 85, 105, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* ВКЛАДКИ РАЗДЕЛОВ (ВНУТРИ ПАНЕЛИ) */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--tab-bg);
            padding: 5px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .tab {
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .tab.active {
            background: var(--accent-primary);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        /* КОНТЕЙНЕР ДЛЯ СПИСКА И АЛФАВИТА */
        .content-wrapper {
            display: flex;
            align-items: flex-start;
            position: relative;
            gap: 12px;
        }

        /* Список и Категории */
        .names-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            padding-bottom: 24px; 
        }

        .category-header {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-primary);
            padding: 24px 0 8px 8px;
            border-bottom: 2px solid var(--card-border);
            margin-top: 4px;
            margin-bottom: 6px;
            scroll-margin-top: 290px;
        }

        .name-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 18px 20px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .name-card:hover {
            transform: scale(1.01);
            border-color: var(--accent-primary);
        }

        .name-text {
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .checkbox-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .name-card.selected {
            border-color: var(--accent-primary);
            background: var(--input-bg);
        }

        .name-card.selected .checkbox-circle {
            border-color: var(--accent-success);
            background: var(--accent-success);
        }

        .name-card.selected .checkbox-circle::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: 700;
        }

        /* АЛФАВИТНЫЙ СКРОЛЛ */
        .alphabet-index {
            position: sticky;
            top: 310px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 20px;
            padding: 12px 6px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px var(--shadow-color);
            max-height: calc(100vh - 330px);
            overflow-y: auto;
            flex-shrink: 0;
            width: 38px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .alphabet-index::-webkit-scrollbar {
            display: none;
        }

        .alphabet-letter {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            min-width: 26px;
            min-height: 26px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 4px;
            user-select: none;
        }

        .alphabet-letter.active {
            background: var(--accent-primary);
            color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .alphabet-letter:hover {
            background: var(--card-border);
            color: var(--text-main);
        }
        
        .alphabet-letter.active:hover {
            background: var(--accent-primary);
            color: #ffffff;
        }

        /* СТИЛЬНЫЙ ПЛАШЕЧНЫЙ ФОЛЛБЕК ЗАГРУЗКИ ФАЙЛА */
        .upload-fallback {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            display: none;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        .upload-fallback p {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-file-custom {
            background: var(--accent-primary);
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0 auto;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .btn-file-custom:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .hidden-input {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 15px;
            width: 100%;
        }

        /* ЦЕНТРИРОВАННОЕ МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            padding: 32px 28px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px var(--shadow-color);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.show .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto 18px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-icon.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-success);
        }

        .modal-icon.error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        .modal-body {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
            font-weight: 400;
        }

        .modal-body b {
            color: var(--text-main);
            font-weight: 600;
        }

        .modal-btn {
            background: var(--accent-primary);
            color: #ffffff;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .modal-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-btn-secondary {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            box-shadow: none;
        }

        .modal-btn-secondary:hover {
            background: var(--card-border);
            transform: translateY(-1px);
        }

        .modal-btn-danger {
            background: #ef4444;
            color: #ffffff;
        }

        .modal-btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ИМЕНА ДЛЯ МАЛЬЧИКОВ</h1>
            <div class="subtitle">Удобный выбор и сохранение вариантов</div>
        </header>

        <!-- Блок загрузки списка, если авто-запрос не прошел -->
        <div id="uploadFallback" class="upload-fallback">
            <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin: 0 auto; color: var(--accent-primary);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <p>Не удалось найти файл со списком. Загрузите его, чтобы продолжить:</p>
            <label class="btn-file-custom">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Выбрать файл списка
                <input type="file" id="namesSourceInput" class="hidden-input" accept=".txt">
            </label>
        </div>

        <!-- Единая липкая панель (управление, поиск и вкладки) -->
        <div class="control-panel">
            <div class="stats">
                <div>Всего загружено: <span id="totalCount">0</span></div>
                <div>Выбрано: <span id="selectedCount">0</span></div>
            </div>
            
            <div class="btn-group">
                <button class="btn-save" onclick="saveData()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    СОХРАНИТЬ
                </button>
                <label class="btn-restore btn-label">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    ВОССТАНОВИТЬ
                    <input type="file" id="restoreFileInput" class="hidden-input" accept=".json" onchange="restoreData(event)">
                </label>
            </div>

            <div class="search-box">
                <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск имени..." oninput="render()">
            </div>

            <!-- Вкладки разделов интегрированы внутрь панели -->
            <div class="tabs">
                <div id="tabAll" class="tab active" onclick="switchTab('all')">Все имена</div>
                <div id="tabFav" class="tab" onclick="switchTab('fav')">Избранное</div>
            </div>
        </div>

        <!-- Обертка для контента: список + сайдбар -->
        <div class="content-wrapper">
            <main id="namesGrid" class="names-grid">
                <!-- Список генерируется здесь -->
            </main>

            <!-- Sticky ползунок алфавита -->
            <div id="alphabetIndex" class="alphabet-index" style="display: none;"></div>
        </div>
    </div>

    <!-- Красивое модальное окно -->
    <div id="modalOverlay" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-box">
            <div id="modalIcon" class="modal-icon success">
                <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h3 id="modalTitle" class="modal-title">Заголовок</h3>
            <div id="modalBody" class="modal-body">Текст сообщения...</div>
            <div id="modalFooter">
                <button class="modal-btn" onclick="closeModal()">ОК</button>
            </div>
        </div>
    </div>

    <script>
        let state = {
            allNames: [],
            selectedNames: new Set(),
            currentTab: 'all',
            scrollPositions: { all: 0, fav: 0 }
        };

        let observer = null;
        let modalCallback = null;
        let scrollTimeout = null;

        // Отслеживание и сохранение прокрутки
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                state.scrollPositions[state.currentTab] = window.scrollY || document.documentElement.scrollTop;
                localStorage.setItem('boy_names_scroll_pos', JSON.stringify(state.scrollPositions));
            }, 100);
        });

        function loadScrollPositions() {
            const stored = localStorage.getItem('boy_names_scroll_pos');
            if (stored) {
                try {
                    state.scrollPositions = JSON.parse(stored);
                } catch (e) {}
            }
        }

        function restoreScrollPosition() {
            const pos = state.scrollPositions[state.currentTab] || 0;
            requestAnimationFrame(() => {
                window.scrollTo({ top: pos, behavior: 'instant' });
            });
        }

        // Система модальных окон
        function showModal(title, message, type = 'success') {
            modalCallback = null;
            const overlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modalIcon = document.getElementById('modalIcon');
            const modalFooter = document.getElementById('modalFooter');

            modalTitle.innerText = title;
            modalBody.innerHTML = message;
            modalIcon.className = `modal-icon ${type}`;

            if (type === 'success') {
                modalIcon.innerHTML = `<svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`;
            } else {
                modalIcon.innerHTML = `<svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>`;
            }

            modalFooter.innerHTML = `<button class="modal-btn" onclick="closeModal()">ОК</button>`;
            overlay.classList.add('show');
        }

        function showConfirmModal(title, message, onConfirm) {
            modalCallback = onConfirm;
            const overlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modalIcon = document.getElementById('modalIcon');
            const modalFooter = document.getElementById('modalFooter');

            modalTitle.innerText = title;
            modalBody.innerHTML = message;
            modalIcon.className = `modal-icon error`;
            modalIcon.innerHTML = `<svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;

            modalFooter.innerHTML = `
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Отмена</button>
                    <button class="modal-btn modal-btn-danger" onclick="executeModalConfirm()">Удалить</button>
                </div>
            `;

            overlay.classList.add('show');
        }

        function executeModalConfirm() {
            if (modalCallback) {
                modalCallback();
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function handleOverlayClick(event) {
            if (event.target === document.getElementById('modalOverlay')) {
                closeModal();
            }
        }

        function getRealName(fullName) {
            const words = fullName.trim().split(/\s+/);
            return words.length >= 2 ? words[1] : words[0];
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFavoritesFromStorage();
            loadScrollPositions();
            tryAutoFetchNames();
            
            document.getElementById('namesSourceInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    processRawNamesText(evt.target.result);
                    document.getElementById('uploadFallback').style.display = 'none';
                    showModal("Список загружен", "Файл со списком имен успешно обработан. Все данные отсортированы и готовы к работе.", "success");
                };
                reader.readAsText(file, 'UTF-8');
            });
        });

        function tryAutoFetchNames() {
            fetch('names_m.txt')
                .then(response => {
                    if (!response.ok) throw new Error('Файл не найден');
                    return response.text();
                })
                .then(text => {
                    processRawNamesText(text);
                })
                .catch(err => {
                    document.getElementById('uploadFallback').style.display = 'flex';
                });
        }

        function processRawNamesText(text) {
            state.allNames = text
                .split('\n')
                .map(name => name.trim())
                .filter(name => name.length > 1);
            
            state.allNames = [...new Set(state.allNames)].sort((a, b) => {
                const nameA = getRealName(a);
                const nameB = getRealName(b);
                return nameA.localeCompare(nameB, 'ru');
            });
            
            updateStats();
            render();
        }

        function loadFavoritesFromStorage() {
            const stored = localStorage.getItem('selected_boy_names');
            if (stored) {
                try {
                    const arr = JSON.parse(stored);
                    state.selectedNames = new Set(arr);
                } catch (e) {}
            }
        }

        function saveToStorage() {
            localStorage.setItem('selected_boy_names', JSON.stringify(Array.from(state.selectedNames)));
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').innerText = state.allNames.length;
            document.getElementById('selectedCount').innerText = state.selectedNames.size;
        }

        function switchTab(tab) {
            if (state.currentTab === tab) return;
            
            state.scrollPositions[state.currentTab] = window.scrollY || document.documentElement.scrollTop;
            
            state.currentTab = tab;
            document.getElementById('tabAll').classList.toggle('active', tab === 'all');
            document.getElementById('tabFav').classList.toggle('active', tab === 'fav');
            
            render();
        }

        function toggleName(name) {
            if (state.selectedNames.has(name)) {
                showConfirmModal(
                    "Удаление из избранного",
                    `Вы действительно хотите удалить имя <b>${name}</b> из избранного?`,
                    () => {
                        state.selectedNames.delete(name);
                        saveToStorage();
                        
                        const cards = document.querySelectorAll('.name-card');
                        cards.forEach(card => {
                            if (card.dataset.name === name) {
                                card.classList.toggle('selected', state.selectedNames.has(name));
                            }
                        });

                        if (state.currentTab === 'fav') {
                            render();
                        }
                    }
                );
            } else {
                state.selectedNames.add(name);
                saveToStorage();
                
                const cards = document.querySelectorAll('.name-card');
                cards.forEach(card => {
                    if (card.dataset.name === name) {
                        card.classList.toggle('selected', state.selectedNames.has(name));
                    }
                });
            }
        }

        function initScrollspy() {
            if (observer) {
                observer.disconnect();
            }

            const options = {
                root: null,
                rootMargin: '-290px 0px -65% 0px', 
                threshold: 0
            };

            let currentActiveLetter = null;

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        currentActiveLetter = entry.target.innerText.trim();
                        highlightLetter(currentActiveLetter);
                    }
                });
            }, options);

            document.querySelectorAll('.category-header').forEach(header => {
                observer.observe(header);
            });
        }

        function highlightLetter(letter) {
            document.querySelectorAll('.alphabet-letter').forEach(el => {
                if (el.innerText === letter) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'auto', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function render() {
            const grid = document.getElementById('namesGrid');
            const alphabetContainer = document.getElementById('alphabetIndex');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            grid.innerHTML = '';
            alphabetContainer.innerHTML = '';

            let filtered = state.allNames;
            
            if (state.currentTab === 'fav') {
                filtered = filtered.filter(name => state.selectedNames.has(name));
            }

            if (searchKeyword) {
                filtered = filtered.filter(name => name.toLowerCase().includes(searchKeyword));
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">Список пуст</div>`;
                alphabetContainer.style.display = 'none';
                restoreScrollPosition();
                return;
            }

            const fragment = document.createDocumentFragment();
            const alphabetFragment = document.createDocumentFragment();
            
            let currentLetter = '';
            const uniqueLetters = [];
            
            filtered.forEach(name => {
                const realName = getRealName(name);
                const firstLetter = realName.charAt(0).toUpperCase();
                
                if (firstLetter !== currentLetter) {
                    currentLetter = firstLetter;
                    uniqueLetters.push(currentLetter);
                    
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.id = `letter-${currentLetter}`;
                    header.innerText = currentLetter;
                    fragment.appendChild(header);
                }

                const isSelected = state.selectedNames.has(name);
                const card = document.createElement('div');
                card.className = `name-card ${isSelected ? 'selected' : ''}`;
                card.dataset.name = name;
                card.onclick = () => toggleName(name);

                card.innerHTML = `
                    <div class="name-text">${name}</div>
                    <div class="checkbox-circle"></div>
                `;
                
                fragment.appendChild(card);
            });

            grid.appendChild(fragment);

            if (uniqueLetters.length > 1) {
                alphabetContainer.style.display = 'flex';
                uniqueLetters.forEach((letter, index) => {
                    const letterEl = document.createElement('div');
                    letterEl.className = 'alphabet-letter';
                    letterEl.innerText = letter;
                    if (index === 0) letterEl.classList.add('active');
                    
                    letterEl.onclick = () => {
                        const target = document.getElementById(`letter-${letter}`);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    };
                    alphabetFragment.appendChild(letterEl);
                });
                alphabetContainer.appendChild(alphabetFragment);
                
                setTimeout(initScrollspy, 100);
            } else {
                alphabetContainer.style.display = 'none';
            }

            restoreScrollPosition();
        }

        async function saveData() {
            if (state.allNames.length === 0) {
                showModal("Ошибка сохранения", "Список имен пуст. Загрузите файл со списком перед сохранением резервной копии.", "error");
                return;
            }

            // Фиксируем актуальную прокрутку перед экспортом
            state.scrollPositions[state.currentTab] = window.scrollY || document.documentElement.scrollTop;

            const exportData = {
                allNames: state.allNames,
                selectedNames: Array.from(state.selectedNames),
                scrollPositions: state.scrollPositions
            };

            const dataStr = JSON.stringify(exportData, null, 2);

            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'ИМЕНА_МАЛЬЧИКА_БЭКАП.json',
                        types: [{
                            description: 'JSON файлы бэкапа',
                            accept: { 'application/json': ['.json'] }
                        }]
                    });

                    const writable = await handle.createWritable();
                    await writable.write(dataStr);
                    await writable.close();

                    showModal("Бэкап сохранен", "Файл успешно обновлен на вашем устройстве (включая позиции прокрутки).", "success");
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            fallbackDownload(dataStr);
        }

        function fallbackDownload(dataStr) {
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            const fileName = 'ИМЕНА_МАЛЬЧИКА_БЭКАП.json';
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', fileName);
            linkElement.click();

            showModal("Бэкап сохранен", "Резервная копия скачана на ваше устройство.", "success");
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    
                    if (imported && Array.isArray(imported.allNames) && Array.isArray(imported.selectedNames)) {
                        state.allNames = imported.allNames;
                        state.selectedNames = new Set(imported.selectedNames);
                        
                        if (imported.scrollPositions) {
                            state.scrollPositions = imported.scrollPositions;
                            localStorage.setItem('boy_names_scroll_pos', JSON.stringify(state.scrollPositions));
                        }
                    } else if (Array.isArray(imported)) {
                        imported.forEach(name => state.selectedNames.add(name));
                    } else {
                        showModal("Ошибка чтения", "Выбранный файл имеет некорректный формат или поврежден.", "error");
                        return;
                    }

                    saveToStorage();
                    document.getElementById('uploadFallback').style.display = 'none';
                    render();
                    
                    showModal(
                        "Данные восстановлены", 
                        `Резервная копия успешно загружена.<br><br>• Всего имен: <b>${state.allNames.length}</b><br>• Выбрано: <b>${state.selectedNames.size}</b><br>• Позиции скролла восстановлены`, 
                        "success"
                    );
                } catch (err) {
                    showModal("Ошибка чтения", "Не удалось прочитать файл JSON. Убедитесь, что выбрали правильный файл бэкапа.", "error");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
</body>
</html>
