<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Выбор Имени</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* БАЗОВАЯ (СВЕТЛАЯ) ТЕМА */
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(148, 163, 184, 0.2);
            --accent-primary: #475569; 
            --accent-hover: #334155;
            --accent-success: #10b981;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --glass-blur: blur(20px);
            --shadow-color: rgba(0, 0, 0, 0.05);
            --input-bg: rgba(255, 255, 255, 0.5);
            --tab-bg: rgba(226, 232, 240, 0.5);
            --gender-m: #3b82f6;
            --gender-w: #ec4899;
        }

        /* ТЕМНАЯ ТЕМА */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
                --card-bg: rgba(30, 41, 59, 0.7);
                --card-border: rgba(255, 255, 255, 0.08);
                --accent-primary: #64748b;
                --accent-hover: #94a3b8;
                --accent-success: #10b981;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --shadow-color: rgba(0, 0, 0, 0.3);
                --input-bg: rgba(15, 23, 42, 0.6);
                --tab-bg: rgba(15, 23, 42, 0.6);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom)) 20px;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            flex-grow: 1;
        }

        /* Заголовок */
        header {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ЕДИНЫЙ ЛИПКИЙ БЛОК УПРАВЛЕНИЯ И ВКЛАДОК */
        .control-panel {
            position: sticky;
            top: 20px;
            z-index: 40;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 35px var(--shadow-color);
        }

        /* Переключатель пола */
        .gender-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--tab-bg);
            padding: 4px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .gender-btn {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text-muted);
        }

        .gender-btn.active.m {
            background: var(--gender-m);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .gender-btn.active.w {
            background: var(--gender-w);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 500;
        }

        .stats span {
            color: var(--text-main);
            font-weight: 700;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button, .btn-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .btn-save {
            background: var(--accent-primary);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .btn-save:hover, .btn-save:active {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-restore {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
        }

        .btn-restore:hover, .btn-restore:active {
            background: var(--card-border);
            transform: translateY(-2px);
        }

        /* Полное скрытие системного инпута файла */
        .hidden-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Поиск */
        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(71, 85, 105, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* ВКЛАДКИ РАЗДЕЛОВ (ВНУТРИ ПАНЕЛИ) */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--tab-bg);
            padding: 5px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .tab {
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .tab.active {
            background: var(--accent-primary);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        /* КОНТЕЙНЕР ДЛЯ СПИСКА И АЛФАВИТА */
        .content-wrapper {
            display: flex;
            align-items: flex-start;
            position: relative;
            gap: 12px;
        }

        /* Список и Категории */
        .names-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            padding-bottom: 10px; 
            touch-action: pan-y;
        }

        .category-header {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-primary);
            padding: 16px 0 8px 8px;
            border-bottom: 2px solid var(--card-border);
            margin-top: 8px;
            margin-bottom: 4px;
            scroll-margin-top: 360px;
        }
        
        /* Убираем отступ у первой буквы для идеального выравнивания */
        .category-header:first-child {
            padding-top: 0;
            margin-top: 0;
        }

        .name-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 18px 20px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .name-card:hover {
            transform: scale(1.01);
            border-color: var(--accent-primary);
        }

        .name-text {
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .checkbox-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .name-card.selected {
            border-color: var(--accent-primary);
            background: var(--input-bg);
        }

        .name-card.selected .checkbox-circle {
            border-color: var(--accent-success);
            background: var(--accent-success);
        }

        .name-card.selected .checkbox-circle::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: 700;
        }

        /* АЛФАВИТНЫЙ СКРОЛЛ */
        .alphabet-index {
            position: sticky;
            top: 370px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 20px;
            padding: 12px 6px;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px var(--shadow-color);
            max-height: calc(100vh - 390px);
            overflow-y: auto;
            flex-shrink: 0;
            width: 38px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .alphabet-index::-webkit-scrollbar {
            display: none;
        }

        .alphabet-letter {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            min-width: 26px;
            min-height: 26px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 4px;
            user-select: none;
        }

        .alphabet-letter.active {
            background: var(--accent-primary);
            color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 15px;
            width: 100%;
        }

        /* ИСПРАВЛЕННЫЙ ОВЕРЛЕЙ */
        .modal-overlay {
            position: fixed;
            inset: 0; /* Равносильно top: 0; right: 0; bottom: 0; left: 0; - решает баги на мобилках */
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999; /* Надежно поверх всего */
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            padding: 32px 28px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px var(--shadow-color);
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.show .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto 18px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-icon.success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-success);
        }

        .modal-icon.error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        .modal-body {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
            font-weight: 400;
        }

        .modal-btn {
            background: var(--accent-primary);
            color: #ffffff;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .modal-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-btn-secondary {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            box-shadow: none;
        }

        .modal-btn-danger {
            background: #ef4444;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="mainTitle">ИМЕНА ДЛЯ МАЛЬЧИКОВ</h1>
            <div class="subtitle">Удобный выбор и сохранение вариантов</div>
        </header>

        <div class="control-panel">
            <div class="gender-selector">
                <div id="genderM" class="gender-btn active m" onclick="switchGender('m')">Мужские имена</div>
                <div id="genderW" class="gender-btn w" onclick="switchGender('w')">Женские имена</div>
            </div>

            <div class="stats">
                <div>Всего загружено: <span id="totalCount">0</span></div>
                <div>Выбрано: <span id="selectedCount">0</span></div>
            </div>
            
            <div class="btn-group">
                <button class="btn-save" onclick="saveData()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    СОХРАНИТЬ
                </button>
                <label class="btn-restore btn-label">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    ВОССТАНОВИТЬ
                    <input type="file" id="restoreFileInput" class="hidden-input" accept=".json" onchange="restoreData(event)">
                </label>
            </div>

            <div class="search-box">
                <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Поиск имени..." oninput="render()">
            </div>

            <div class="tabs">
                <div id="tabAll" class="tab active" onclick="switchTab('all')">Все имена</div>
                <div id="tabFav" class="tab" onclick="switchTab('fav')">Избранное</div>
            </div>
        </div>

        <div class="content-wrapper">
            <main id="namesGrid" class="names-grid"></main>
            <div id="alphabetIndex" class="alphabet-index" style="display: none;"></div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="modalOverlay" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-box">
            <div id="modalIcon" class="modal-icon success"></div>
            <h3 id="modalTitle" class="modal-title">Заголовок</h3>
            <div id="modalBody" class="modal-body">Текст...</div>
            <div id="modalFooter"></div>
        </div>
    </div>

    <script>
        let state = {
            gender: 'm',
            namesData: { m: [], w: [] },
            selectedData: { m: new Set(), w: new Set() },
            currentTab: 'all',
            scrollPositions: {
                m: { all: 0, fav: 0 },
                w: { all: 0, fav: 0 }
            },
            availableLetters: []
        };

        let observer = null;
        let modalCallback = null;
        let scrollTimeout = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                state.scrollPositions[state.gender][state.currentTab] = window.scrollY || document.documentElement.scrollTop;
                localStorage.setItem('names_scroll_positions', JSON.stringify(state.scrollPositions));
            }, 100);
        });

        function loadScrollPositions() {
            const stored = localStorage.getItem('names_scroll_positions');
            if (stored) {
                try { state.scrollPositions = JSON.parse(stored); } catch (e) {}
            }
        }

        function restoreScrollPosition() {
            const pos = state.scrollPositions[state.gender][state.currentTab] || 0;
            requestAnimationFrame(() => { window.scrollTo({ top: pos, behavior: 'instant' }); });
        }

        function showModal(title, message, type = 'success') {
            modalCallback = null;
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = message;
            
            const icon = document.getElementById('modalIcon');
            icon.className = `modal-icon ${type}`;
            icon.innerHTML = type === 'success' 
                ? `<svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`
                : `<svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>`;

            document.getElementById('modalFooter').innerHTML = `<button class="modal-btn" onclick="closeModal()">ОК</button>`;
            overlay.classList.add('show');
        }

        function showConfirmModal(title, message, onConfirm) {
            modalCallback = onConfirm;
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = message;
            
            const icon = document.getElementById('modalIcon');
            icon.className = `modal-icon error`;
            icon.innerHTML = `<svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;

            document.getElementById('modalFooter').innerHTML = `
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Отмена</button>
                    <button class="modal-btn modal-btn-danger" onclick="executeModalConfirm()">Удалить</button>
                </div>
            `;
            overlay.classList.add('show');
        }

        function executeModalConfirm() {
            if (modalCallback) modalCallback();
            closeModal();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function handleOverlayClick(event) {
            if (event.target === document.getElementById('modalOverlay')) closeModal();
        }

        function getRealName(fullName) {
            const words = fullName.trim().split(/\s+/);
            return words.length >= 2 ? words[1] : words[0];
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFavoritesFromStorage();
            loadScrollPositions();
            fetchNamesForGender();
            setupSwipeFeature();
        });

        function fetchNamesForGender() {
            const file = state.gender === 'm' ? 'names_m.txt' : 'names_g.txt';
            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('Файл не найден');
                    return response.text();
                })
                .then(text => processRawNamesText(text))
                .catch(err => {
                    console.error("Ошибка авто-загрузки: ", err);
                    state.namesData[state.gender] = [];
                    updateStats();
                    render();
                });
        }

        function processRawNamesText(text) {
            let names = text.split('\n').map(n => n.trim()).filter(n => n.length > 1);
            names = [...new Set(names)].sort((a, b) => getRealName(a).localeCompare(getRealName(b), 'ru'));
            state.namesData[state.gender] = names;
            updateStats();
            render();
        }

        function loadFavoritesFromStorage() {
            try {
                const storedM = localStorage.getItem('selected_boy_names');
                if (storedM) state.selectedData.m = new Set(JSON.parse(storedM));
                const storedW = localStorage.getItem('selected_girl_names');
                if (storedW) state.selectedData.w = new Set(JSON.parse(storedW));
            } catch (e) {}
        }

        function saveToStorage() {
            const key = state.gender === 'm' ? 'selected_boy_names' : 'selected_girl_names';
            localStorage.setItem(key, JSON.stringify(Array.from(state.selectedData[state.gender])));
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').innerText = state.namesData[state.gender].length;
            document.getElementById('selectedCount').innerText = state.selectedData[state.gender].size;
        }

        function switchGender(g) {
            if (state.gender === g) return;
            state.scrollPositions[state.gender][state.currentTab] = window.scrollY || document.documentElement.scrollTop;
            state.gender = g;
            
            document.getElementById('genderM').classList.toggle('active', g === 'm');
            document.getElementById('genderW').classList.toggle('active', g === 'w');
            document.getElementById('mainTitle').innerText = g === 'm' ? "ИМЕНА ДЛЯ МАЛЬЧИКОВ" : "ИМЕНА ДЛЯ ДЕВОЧЕК";
            document.getElementById('searchInput').value = '';
            
            updateStats();
            state.namesData[g].length === 0 ? fetchNamesForGender() : render();
        }

        function switchTab(tab) {
            if (state.currentTab === tab) return;
            state.scrollPositions[state.gender][state.currentTab] = window.scrollY || document.documentElement.scrollTop;
            state.currentTab = tab;
            
            document.getElementById('tabAll').classList.toggle('active', tab === 'all');
            document.getElementById('tabFav').classList.toggle('active', tab === 'fav');
            render();
        }

        function toggleName(name) {
            const currentSelected = state.selectedData[state.gender];
            if (currentSelected.has(name)) {
                showConfirmModal(
                    "Удаление из избранного",
                    `Вы действительно хотите удалить имя <b>${name}</b> из избранного?`,
                    () => {
                        currentSelected.delete(name);
                        saveToStorage();
                        if (state.currentTab === 'fav') render();
                        else updateCardVisuals(name, false);
                    }
                );
            } else {
                currentSelected.add(name);
                saveToStorage();
                updateCardVisuals(name, true);
            }
        }

        function updateCardVisuals(name, isSelected) {
            document.querySelectorAll('.name-card').forEach(card => {
                if (card.dataset.name === name) card.classList.toggle('selected', isSelected);
            });
        }

        function initScrollspy() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) highlightLetter(entry.target.innerText.trim());
                });
            }, { root: null, rootMargin: '-360px 0px -60% 0px', threshold: 0 });

            document.querySelectorAll('.category-header').forEach(h => observer.observe(h));
        }

        function highlightLetter(letter) {
            document.querySelectorAll('.alphabet-letter').forEach(el => {
                if (el.innerText === letter) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'auto', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function render() {
            const grid = document.getElementById('namesGrid');
            const alphabetContainer = document.getElementById('alphabetIndex');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            grid.innerHTML = '';
            alphabetContainer.innerHTML = '';
            state.availableLetters = [];

            let filtered = state.namesData[state.gender];
            if (state.currentTab === 'fav') filtered = filtered.filter(name => state.selectedData[state.gender].has(name));
            if (searchKeyword) filtered = filtered.filter(name => name.toLowerCase().includes(searchKeyword));

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">Список пуст</div>`;
                alphabetContainer.style.display = 'none';
                restoreScrollPosition();
                return;
            }

            const fragment = document.createDocumentFragment();
            const alphabetFragment = document.createDocumentFragment();
            let currentLetter = '';
            
            filtered.forEach(name => {
                const firstLetter = getRealName(name).charAt(0).toUpperCase();
                if (firstLetter !== currentLetter) {
                    currentLetter = firstLetter;
                    state.availableLetters.push(currentLetter);
                    
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.id = `letter-${currentLetter}`;
                    header.innerText = currentLetter;
                    fragment.appendChild(header);
                }

                const isSelected = state.selectedData[state.gender].has(name);
                const card = document.createElement('div');
                card.className = `name-card ${isSelected ? 'selected' : ''}`;
                card.dataset.name = name;
                card.onclick = () => toggleName(name);
                card.innerHTML = `<div class="name-text">${name}</div><div class="checkbox-circle"></div>`;
                fragment.appendChild(card);
            });

            grid.appendChild(fragment);

            if (state.availableLetters.length > 1) {
                alphabetContainer.style.display = 'flex';
                state.availableLetters.forEach((letter, index) => {
                    const letterEl = document.createElement('div');
                    letterEl.className = 'alphabet-letter';
                    letterEl.innerText = letter;
                    if (index === 0) letterEl.classList.add('active');
                    
                    letterEl.onclick = () => {
                        const target = document.getElementById(`letter-${letter}`);
                        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    };
                    alphabetFragment.appendChild(letterEl);
                });
                alphabetContainer.appendChild(alphabetFragment);
                setTimeout(initScrollspy, 100);
            } else {
                alphabetContainer.style.display = 'none';
            }

            restoreScrollPosition();
        }

        // ПРАВИЛЬНАЯ РЕАЛИЗАЦИЯ СВАЙПОВ МЕЖДУ ПОДКАТЕГОРИЯМИ (Вкладками)
        function setupSwipeFeature() {
            const body = document.body;

            body.addEventListener('touchstart', (e) => {
                // Игнорируем свайпы, если пользователь листает алфавит или ползунок
                if (e.target.closest('.alphabet-index') || e.target.closest('.control-panel')) return;
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            body.addEventListener('touchend', (e) => {
                if (e.target.closest('.alphabet-index') || e.target.closest('.control-panel')) return;
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipeGesture();
            }, { passive: true });
        }

        function handleSwipeGesture() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            // Определяем, что это именно горизонтальный свайп с достаточной длиной (более 60px)
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 60) {
                if (deltaX < 0) {
                    // Свайп влево: переходим во вкладку "Избранное"
                    if (state.currentTab === 'all') switchTab('fav');
                } else {
                    // Свайп вправо: возвращаемся во вкладку "Все имена"
                    if (state.currentTab === 'fav') switchTab('all');
                }
            }
        }

        async function saveData() {
            if (state.namesData.m.length === 0 && state.namesData.w.length === 0) {
                showModal("Ошибка", "Базы данных имен пусты.", "error");
                return;
            }

            state.scrollPositions[state.gender][state.currentTab] = window.scrollY || document.documentElement.scrollTop;

            const exportData = {
                namesData: state.namesData,
                selectedData: { m: Array.from(state.selectedData.m), w: Array.from(state.selectedData.w) },
                scrollPositions: state.scrollPositions
            };

            const dataStr = JSON.stringify(exportData, null, 2);
            const fileName = `РЕЗЕРВНАЯ_КОПИЯ_ИМЕН.json`;

            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: fileName,
                        types: [{ description: 'JSON файлы бэкапа', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(dataStr);
                    await writable.close();
                    showModal("Успех", "Бэкап сохранен на устройстве.", "success");
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }
            fallbackDownload(dataStr, fileName);
        }

        function fallbackDownload(dataStr, fileName) {
            const a = document.createElement('a');
            a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            a.download = fileName;
            a.click();
            showModal("Успех", "Резервная копия скачана.", "success");
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.namesData && imported.selectedData) {
                        if (Array.isArray(imported.namesData.m)) state.namesData.m = imported.namesData.m;
                        if (Array.isArray(imported.namesData.w)) state.namesData.w = imported.namesData.w;
                        state.selectedData.m = new Set(imported.selectedData.m || []);
                        state.selectedData.w = new Set(imported.selectedData.w || []);
                        if (imported.scrollPositions) state.scrollPositions = imported.scrollPositions;
                        
                        localStorage.setItem('selected_boy_names', JSON.stringify(Array.from(state.selectedData.m)));
                        localStorage.setItem('selected_girl_names', JSON.stringify(Array.from(state.selectedData.w)));
                        localStorage.setItem('names_scroll_positions', JSON.stringify(state.scrollPositions));
                        
                        updateStats();
                        render();
                        showModal("Успех", "Резервная копия успешно загружена.", "success");
                    } else {
                        showModal("Ошибка", "Некорректный формат файла.", "error");
                    }
                } catch (err) {
                    showModal("Ошибка", "Не удалось прочитать JSON-файл.", "error");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
    </script>
</body>
</html>
